<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>15m Confirmed Closes</title>
<style>
:root{
  --font: "SF Pro Display", -apple-system, BlinkMacSystemFont, ui-sans-serif, system-ui, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --bg:#f6f2e7; --row:#fffdf8; --text:#1c1c1e; --dim:#6b6b70; --faint:#a8a29e;
  --hair:#e3ddcd; --green:#15803d; --red:#dc2626; --purple:#7c3aed;
  --tan-track:#e9dec6; --burnt:#c05621; --badge-tan-bg:#f3e5c3; --badge-tan-tx:#8a6d1a;
  --pill-bg:#fffdf8; --pill-on:#1c1c1e; --gold:#b8860b;
}
*{box-sizing:border-box; margin:0; padding:0}
body{background:var(--bg); color:var(--text); font-family:var(--font); padding:20px 18px 48px; max-width:1240px; margin:0 auto; min-height:100vh}
a{color:var(--burnt); text-decoration:none}
.back{font-size:14px; font-weight:700; display:inline-block; margin-bottom:10px}
/* header */
.hdr{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
h1{font-size:29px; font-weight:800; letter-spacing:-.01em}
.badge{font-size:11px; font-weight:800; letter-spacing:.12em; border-radius:999px; padding:5px 12px}
.badge.live{background:var(--green); color:#fff}
.badge.final{background:#57534e; color:#fff}
.sub{font-size:14.5px; color:var(--dim); margin-top:7px}
.sub strong{color:var(--text)}
.updated{font-size:12.5px; color:var(--faint); font-family:var(--mono); margin-top:3px}
.legend{font-size:12.5px; color:var(--dim); margin-top:8px}
.legend .sw{display:inline-block; width:18px; border-top:3px solid; vertical-align:middle; margin:0 4px 0 10px}
.legend .sw:first-child{margin-left:0}
.legend .dash{border-top-style:dashed; border-color:#9ca3af}
.legend .pur{border-color:var(--purple)} .legend .red{border-color:var(--red)}
/* controls */
.controls{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:16px 0 6px}
.controls .sep{width:1px; height:22px; background:var(--hair); margin:0 4px}
.pill{font-family:var(--font); font-size:13.5px; font-weight:700; padding:7px 18px; border-radius:999px;
  border:1px solid var(--hair); background:var(--pill-bg); color:var(--text); cursor:pointer; white-space:nowrap}
.pill.on{background:var(--pill-on); border-color:var(--pill-on); color:#fff}
.pill.fav.on{background:var(--gold); border-color:var(--gold); color:#fff}
.clabel{font-size:11px; font-weight:800; letter-spacing:1.2px; color:var(--faint)}
/* the ranked row list */
.list{background:var(--row); border:1px solid var(--hair); border-radius:14px; overflow:hidden; margin-top:10px}
.row{display:grid; grid-template-columns:46px 218px minmax(0,1fr) 262px 38px; gap:14px; align-items:center;
  padding:13px 16px; border-bottom:1px solid var(--hair)}
.row:last-child{border-bottom:none}
.rank{font-size:14px; font-weight:600; color:var(--faint); font-variant-numeric:tabular-nums}
.ident{min-width:0}
.ident .l1{display:flex; align-items:center; gap:7px; min-width:0}
.ident .arr{font-size:13px; flex:none}
.ident .arr.up{color:var(--green)} .ident .arr.dn{color:var(--red)}
.ident .tk{font-weight:800; font-size:19px; white-space:nowrap}
.stbadge{font-size:9.5px; font-weight:800; letter-spacing:.06em; border-radius:5px; padding:2.5px 7px; white-space:nowrap; flex:none}
.stbadge.new{color:var(--green); border:1px solid rgba(21,128,61,.45); background:rgba(21,128,61,.08)}
.stbadge.flipped{color:var(--burnt); border:1px solid rgba(192,86,33,.45); background:rgba(192,86,33,.08)}
.stbadge.fading{color:var(--badge-tan-tx); background:var(--badge-tan-bg); border:1px solid #e3d29b}
.ident .nm{font-size:13px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px}
.ident .meta{font-size:13.5px; color:var(--dim); margin-top:3px; font-variant-numeric:tabular-nums; white-space:nowrap}
.ident .meta .pct.up{color:var(--green); font-weight:700}
.ident .meta .pct.dn{color:var(--red); font-weight:700}
canvas.chart{width:100%; height:92px; display:block; min-width:0}
.stats{min-width:0; font-variant-numeric:tabular-nums}
.stats .verdict{font-size:13.5px; font-weight:800; letter-spacing:.02em; white-space:nowrap}
.stats .verdict.up{color:var(--green)} .stats .verdict.dn{color:var(--red)}
.stats .levels{font-size:13px; margin-top:4px; white-space:nowrap}
.stats .levels .pur{color:var(--purple); font-weight:700}
.stats .levels .red{color:var(--red); font-weight:700}
.stats .levels .dot{color:var(--faint); margin:0 5px}
.stats .cndl{font-size:12.5px; color:var(--dim); margin-top:4px; white-space:nowrap}
.stats .thru{display:flex; align-items:center; gap:9px; margin-top:7px}
.stats .track{flex:1; height:5px; border-radius:99px; background:var(--tan-track); overflow:hidden; min-width:60px}
.stats .fill{height:100%; background:var(--burnt); border-radius:99px}
.stats .thrulbl{font-size:11px; font-weight:800; letter-spacing:.06em; color:var(--dim); white-space:nowrap}
.star{font-family:var(--font); cursor:pointer; font-size:21px; color:#c9c2ae; background:transparent; border:none;
  width:34px; height:34px; display:flex; align-items:center; justify-content:center; padding:0; line-height:1}
.star.on{color:var(--gold)}
.empty{padding:38px 20px; text-align:center; color:var(--dim); font-size:14.5px; line-height:1.55}
.empty strong{color:var(--text)}
.note{font-size:12px; color:var(--faint); text-align:center; margin-top:14px; line-height:1.5}
@media (max-width:900px){
  .row{grid-template-columns:34px minmax(0,1fr) 34px; grid-template-areas:"rank ident star" "chart chart chart" "stats stats stats"; row-gap:8px}
  .rank{grid-area:rank} .ident{grid-area:ident} canvas.chart{grid-area:chart} .stats{grid-area:stats} .star{grid-area:star}
}
</style>
</head>
<body>
<a class="back" href="index.html">&larr; Back to board</a>

<div class="hdr">
  <h1>15m confirmed closes</h1>
  <span class="badge final" id="liveBadge">FINAL</span>
</div>
<div class="sub" id="subLine">&ndash;</div>
<div class="updated" id="updatedLine"></div>
<div class="legend">
  <span class="sw pur"></span>PDH / PDL&ensp;<span class="sw red"></span>PMH / PML&ensp;<span class="sw dash"></span>dashed line = series mean
</div>

<div class="controls">
  <span class="clabel">MARKET CAP</span>
  <button class="pill cap on" data-cap="all">All</button>
  <button class="pill cap" data-cap="small">Small</button>
  <button class="pill cap" data-cap="mid">Mid</button>
  <button class="pill cap" data-cap="large">Large</button>
  <span class="sep"></span>
  <span class="clabel">SORT</span>
  <button class="pill sort on" data-sort="chg">% Change</button>
  <button class="pill sort" data-sort="cap">Market cap</button>
  <button class="pill sort fav" data-sort="fav">&#9733; Favorites</button>
</div>

<div class="list" id="list"><div class="empty">Loading&hellip;</div></div>

<div class="note">Only completed 15-minute candles are evaluated &mdash; a candle still forming is never shown. The page re-reads the poller output every 5 minutes.</div>

<script>
const RAW = "https://raw.githubusercontent.com/HueTX/options-board-data/main/";
const CDN = "https://cdn.jsdelivr.net/gh/HueTX/options-board-data@main/";
let DATA = null, CHARTS = {};
let capFilter = "all";       // all | small (<$2B) | mid ($2-10B) | large (>$10B)
let sortMode = "chg";        // chg | cap | fav
let favs = new Set();
try { favs = new Set(JSON.parse(localStorage.getItem("ofb_pins") || "[]")); } catch(e){}
function saveFavs(){ try { localStorage.setItem("ofb_pins", JSON.stringify([...favs])); } catch(e){} }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function fmt2(x){ return x == null || !isFinite(x) ? "\u2014" : Number(x).toFixed(2); }
function fmtPct(x){ return x == null || !isFinite(x) ? "\u2014" : (x >= 0 ? "+" : "") + Number(x).toFixed(2) + "%"; }

async function fetchJSON(name){
  for(const base of [RAW, CDN]){
    try{
      const r = await fetch(base + name + "?t=" + Date.now(), {cache:"no-store"});
      if(r.ok) return await r.json();
    }catch(e){ /* try the mirror */ }
  }
  return null;
}

/* session state: live only while the file says the market is open, it is
   today's file, it is fresh, and Chicago time is inside the gate. */
function sessionState(d){
  if(!d) return {live:false, label:"FINAL"};
  const now = new Date();
  const ct = new Date(now.toLocaleString("en-US", {timeZone:"America/Chicago"}));
  const todayCT = ct.getFullYear() + "-" + String(ct.getMonth()+1).padStart(2,"0") + "-" + String(ct.getDate()).padStart(2,"0");
  const mins = ct.getHours()*60 + ct.getMinutes();
  const ageMin = d.asOf ? (Date.now() - new Date(d.asOf).getTime())/60000 : 999;
  const weekday = ct.getDay() >= 1 && ct.getDay() <= 5;
  const live = !!d.marketOpen && d.marketDate === todayCT && weekday && mins >= 510 && mins <= 905 && ageMin <= 10;
  return {live, label: live ? "LIVE" : "FINAL"};
}
function dateLong(iso){
  if(!iso) return "\u2014";
  const d = new Date(iso + "T12:00:00");
  return d.toLocaleDateString("en-US", {month:"short", day:"numeric", year:"numeric"});
}
function ctClock(iso){
  if(!iso) return "";
  const d = new Date(iso);
  return new Intl.DateTimeFormat("en-GB", {timeZone:"America/Chicago", hour:"2-digit", minute:"2-digit", second:"2-digit", hour12:false}).format(d);
}
function candle12h(lbl){ // "15:45 ET" -> "3:45 PM ET"
  if(!lbl) return "\u2014";
  const m = lbl.match(/(\d{1,2}):(\d{2})/);
  if(!m) return lbl;
  let h = parseInt(m[1], 10);
  const ap = h >= 12 ? "PM" : "AM";
  h = h % 12 === 0 ? 12 : h % 12;
  return h + ":" + m[2] + " " + ap + " ET";
}

/* ---- the line chart: completed 15m closes + the four levels + mean ---- */
function drawChart(cv, chart, side){
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = cv.clientWidth || 300, H = cv.clientHeight || 92;
  if(!W || !H) return;
  cv.width = W * dpr; cv.height = H * dpr;
  const ctx = cv.getContext("2d"); ctx.scale(dpr, dpr);
  const PURPLE = "#7c3aed", RED = "#dc2626", GREY = "#9ca3af";
  const lineCol = side === "bear" ? "#dc2626" : "#15803d";
  const pts = (chart && chart.closes15m || []).filter(p => p && isFinite(p.c));
  const lv = (chart && chart.levels) || {};
  const vals = pts.map(p => p.c);
  for(const k of ["pdh","pdl","pmh","pml"]) if(isFinite(lv[k])) vals.push(lv[k]);
  if(chart && isFinite(chart.mean)) vals.push(chart.mean);
  if(!vals.length){
    ctx.fillStyle = "#a8a29e"; ctx.font = "11px system-ui, sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("Chart unavailable", W/2, H/2);
    return;
  }
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const pad = (hi - lo) * 0.08 || Math.max(hi * 0.002, 0.05);
  lo -= pad; hi += pad;
  const labelW = 30, x0 = 2, x1 = W - labelW;
  const py = v => H - 4 - ((v - lo) / (hi - lo)) * (H - 8);
  const px = i => pts.length <= 1 ? (x0 + x1) / 2 : x0 + (i / (pts.length - 1)) * (x1 - x0);
  // level lines span the full chart width, labeled at the right edge
  const level = (v, color, label) => {
    if(v == null || !isFinite(v)) return;
    const y = py(v);
    ctx.strokeStyle = color; ctx.lineWidth = 1.4;
    ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
    ctx.fillStyle = color; ctx.font = "800 8.5px ui-monospace, Menlo, monospace";
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.fillText(label, x1 + 3, y);
  };
  level(lv.pdh, PURPLE, "PDH");
  level(lv.pdl, PURPLE, "PDL");
  level(lv.pmh, RED, "PMH");
  level(lv.pml, RED, "PML");
  // session mean — dashed grey
  if(chart && isFinite(chart.mean)){
    const y = py(chart.mean);
    ctx.strokeStyle = GREY; ctx.lineWidth = 1; ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
    ctx.setLineDash([]);
  }
  // the closes line, in the side's color, with a dot on the final point
  if(pts.length){
    ctx.strokeStyle = lineCol; ctx.lineWidth = 2; ctx.lineJoin = "round"; ctx.lineCap = "round";
    ctx.beginPath();
    pts.forEach((p, i) => { const x = px(i), y = py(p.c); if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); });
    ctx.stroke();
    const lx = px(pts.length - 1), ly = py(pts[pts.length - 1].c);
    ctx.fillStyle = lineCol;
    ctx.beginPath(); ctx.arc(lx, ly, 3.2, 0, Math.PI * 2); ctx.fill();
  }
}

/* ---- rows ---- */
function mergedRows(){
  if(!DATA) return [];
  const bull = (DATA.bullish || []).map(e => ({...e, side:"bull"}));
  const bear = (DATA.bearish || []).map(e => ({...e, side:"bear"}));
  return bull.concat(bear);
}
function capBucket(e){
  const c = e.marketCapB;
  if(c == null || !isFinite(c)) return null;
  return c < 2 ? "small" : (c <= 10 ? "mid" : "large");
}
function visibleRows(){
  let rows = mergedRows();
  if(sortMode === "fav") rows = rows.filter(e => favs.has(e.ticker));
  if(capFilter !== "all") rows = rows.filter(e => capBucket(e) === capFilter);
  const alpha = (a,b) => a.ticker.localeCompare(b.ticker);
  if(sortMode === "cap")
    rows.sort((a,b) => ((b.marketCapB != null ? b.marketCapB : -1) - (a.marketCapB != null ? a.marketCapB : -1)) || alpha(a,b));
  else // % Change (and Favorites): strongest absolute day move first
    rows.sort((a,b) => (Math.abs(b.dayPct != null ? b.dayPct : -1) - Math.abs(a.dayPct != null ? a.dayPct : -1)) || alpha(a,b));
  return rows;
}
function verdictOf(e){
  if(e.side === "bull"){
    const w = e.above === "both" ? "PDH + PMH" : e.above === "pdh" ? "PDH" : "PMH";
    return "CLOSED ABOVE " + w;
  }
  const w = e.below === "both" ? "PDL + PML" : e.below === "pdl" ? "PDL" : "PML";
  return "CLOSED BELOW " + w;
}
function levelsLine(e){
  if(e.side === "bull")
    return '<span class="pur">PDH $' + fmt2(e.pdh) + '</span><span class="dot">\u00B7</span><span class="red">PMH $' + fmt2(e.pmh) + '</span>';
  return '<span class="pur">PDL $' + fmt2(e.pdl) + '</span><span class="dot">\u00B7</span><span class="red">PML $' + fmt2(e.pml) + '</span>';
}
function badgeOf(e){
  if(e.status === "fading") return '<span class="stbadge fading">FADING</span>';
  if(e.status === "new") return '<span class="stbadge new">NEW</span>';
  if(e.status === "flipped") return '<span class="stbadge flipped">FLIPPED</span>';
  return "";
}
function rowHTML(e, rank){
  const bull = e.side === "bull";
  const thru = e.thruPct != null && isFinite(e.thruPct) ? e.thruPct : 0;
  const fill = Math.max(0, Math.min(thru / 3 * 100, 100));
  const capTxt = e.marketCapB != null && isFinite(e.marketCapB) ? "$" + fmt2(e.marketCapB) + "B" : "\u2014";
  return '<div class="row">'
    + '<div class="rank">#' + rank + '</div>'
    + '<div class="ident"><div class="l1">'
    + '<span class="arr ' + (bull ? "up" : "dn") + '">' + (bull ? "\u25B2" : "\u25BC") + '</span>'
    + '<span class="tk">' + esc(e.ticker) + '</span>' + badgeOf(e)
    + '</div>'
    + '<div class="nm">' + esc(e.name || "") + '</div>'
    + '<div class="meta">$' + fmt2(e.close) + ' \u00B7 <span class="pct ' + (bull ? "up" : "dn") + '">' + fmtPct(e.dayPct) + '</span> \u00B7 ' + capTxt + '</div>'
    + '</div>'
    + '<canvas class="chart" data-sym="' + esc(e.ticker) + '" title="dashed line = series mean"></canvas>'
    + '<div class="stats">'
    + '<div class="verdict ' + (bull ? "up" : "dn") + '">' + verdictOf(e) + '</div>'
    + '<div class="levels">' + levelsLine(e) + '</div>'
    + '<div class="cndl">candle ' + candle12h(e.candle) + ' \u00B7 candle ' + fmtPct(e.candlePct) + '</div>'
    + '<div class="thru"><div class="track"><div class="fill" style="width:' + fill.toFixed(1) + '%"></div></div>'
    + '<span class="thrulbl">THRU ' + fmt2(e.thruPct) + '%</span></div>'
    + '</div>'
    + '<button class="star' + (favs.has(e.ticker) ? " on" : "") + '" data-sym="' + esc(e.ticker) + '" aria-label="Favorite ' + esc(e.ticker) + '">' + (favs.has(e.ticker) ? "\u2605" : "\u2606") + '</button>'
    + '</div>';
}
function closedMessage(d){
  const r = d && d.reason;
  if(r === "weekend") return "Market closed \u2014 weekend.";
  if(r === "holiday") return "Market closed \u2014 NYSE holiday.";
  return "Market closed \u2014 outside market hours.";
}
function render(){
  const list = document.getElementById("list");
  const st = sessionState(DATA);
  const badge = document.getElementById("liveBadge");
  badge.textContent = st.label;
  badge.className = "badge " + (st.live ? "live" : "final");
  const active = mergedRows().length;
  const checked = DATA ? (DATA.scanned || 0) : 0;
  document.getElementById("subLine").innerHTML =
    "<strong>" + active + "</strong> active \u00B7 <strong>" + checked + "</strong> checked \u00B7 "
    + esc(dateLong(DATA && DATA.marketDate)) + (st.live ? " \u00B7 live" : " \u00B7 session closed");
  document.getElementById("updatedLine").textContent =
    DATA && DATA.asOf ? "updated " + ctClock(DATA.asOf) + " CT" : "";

  if(!DATA){ list.innerHTML = '<div class="empty">Feed unreachable \u2014 retrying on the next 5-minute cycle.</div>'; return; }
  if(DATA.marketOpen === false){
    list.innerHTML = '<div class="empty"><strong>' + esc(closedMessage(DATA)) + '</strong><br>No rows are shown outside the session \u2014 the list returns with the first completed candle of the next session.</div>';
    return;
  }
  if(!DATA.candle){
    list.innerHTML = '<div class="empty"><strong>No completed candle yet</strong><br>The first 15-minute candle completes at 9:46 AM ET.</div>';
    return;
  }
  const rows = visibleRows();
  if(!rows.length){
    list.innerHTML = '<div class="empty">' + (sortMode === "fav"
      ? "No favorites yet \u2014 tap \u2606 on any row to star it."
      : "No confirmed closes match the current filter on the latest completed candle.") + '</div>';
    return;
  }
  list.innerHTML = rows.map((e, i) => rowHTML(e, i + 1)).join("");
  list.querySelectorAll("canvas.chart").forEach(cv => {
    const e = rows.find(r => r.ticker === cv.dataset.sym);
    drawChart(cv, CHARTS[cv.dataset.sym], e ? e.side : "bull");
  });
  list.querySelectorAll("button.star").forEach(b => b.addEventListener("click", () => {
    const t = b.dataset.sym;
    if(favs.has(t)) favs.delete(t); else favs.add(t);
    saveFavs(); render();
  }));
}
document.querySelectorAll(".pill.cap").forEach(b => b.addEventListener("click", () => {
  capFilter = b.dataset.cap;
  document.querySelectorAll(".pill.cap").forEach(x => x.classList.toggle("on", x === b));
  render();
}));
document.querySelectorAll(".pill.sort").forEach(b => b.addEventListener("click", () => {
  sortMode = b.dataset.sort;
  document.querySelectorAll(".pill.sort").forEach(x => x.classList.toggle("on", x === b));
  render();
}));
let rszT = null;
window.addEventListener("resize", () => { clearTimeout(rszT); rszT = setTimeout(render, 150); });

async function load(){
  const [d, c] = await Promise.all([fetchJSON("fifteen_min_closes.json"), fetchJSON("fifteen_min_charts.json")]);
  if(d) DATA = d;
  if(c && c.charts) CHARTS = c.charts;
  render();
}
load();
setInterval(load, 5 * 60 * 1000);
</script>
</body>
</html>
