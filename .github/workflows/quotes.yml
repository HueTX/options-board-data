# ============================================================
# SETUP: in your new GitHub repo, click "Add file" > "Create new file",
# name it exactly:  .github/workflows/quotes.yml
# then paste this ENTIRE file below this header and commit.
# ============================================================


name: Publish live quotes

# Priority tickers (regime + flow + premarket names) every 5 min during market
# hours and every 15 min premarket; full 311-ticker universe every 30 min
# (including premarket, so the movers feed can rank fresh premarket prices).
# Times are UTC. CT = UTC-5, so 12-13 UTC = 7-8am CT (premarket),
# 13-20 UTC = 8am-3pm CT (market hours). Mon-Fri only.
on:
  schedule:
    - cron: '*/5 13-20 * * 1-5'
    - cron: '*/15 12-13 * * 1-5'
    - cron: '*/30 12-20 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so pull --rebase never trips on a shallow clone

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # setup-python installs a pristine Python WITHOUT requests (only the
      # runner's system python has it). Without this the fetch step dies in
      # ~4s with ModuleNotFoundError -> exit code 1.
      - name: Install requests
        run: python -m pip install --quiet --disable-pip-version-check requests

      - name: Fetch quotes
        run: |
          if [ "${{ github.event.schedule }}" = "*/15 12-13 * * 1-5" ]; then
            # Premarket: fetch BOTH priority and universe. The universe is needed
            # fresh so --movers can rank premarket prices (Hubert 2026-10-02:
            # "Full market movers" must show premarket movers, not Yahoo's
            # day-gainers screener which is stale before the open).
            python fetch_quotes.py tickers_priority.txt quotes.json
            python fetch_quotes.py tickers_universe.txt quotes_universe.json --no-bars
          elif [ "${{ github.event.schedule }}" = "*/30 12-20 * * 1-5" ]; then
            python fetch_quotes.py tickers_universe.txt quotes_universe.json --no-bars
          else
            python fetch_quotes.py tickers_priority.txt quotes.json
          fi
          # Whole-market day gainers/losers (Robinhood-style movers). Runs on
          # every schedule; on failure keep the previous file so the board
          # keeps showing the last good ranking instead of going blank.
          python fetch_quotes.py --movers market_movers.json || echo "movers fetch failed, keeping previous"
          # Detail-drawer bars + 1H regime bars for tickers outside the
          # 56-ticker quotes feed. Runs on every schedule; on failure keep
          # the previous files so the board keeps showing the last good data.
          python fetch_quotes.py --dbars dbars.json || echo "dbars fetch failed, keeping previous"
          python fetch_quotes.py --regime1h regime1h.json || echo "regime1h fetch failed, keeping previous"
          # NOTE: the morning watchlist (watchlist.json + wcharts.json) is published
          # by the 08:05 CT morning-breakout-watchlist cron from the true 311-ticker
          # premarket scan. Do NOT rebuild it here: the old --watchlist step ranked a
          # different 72-ticker set by closing-price proximity and clobbered the real
          # morning list on every manual dispatch.

      - name: Commit and push
        run: |
          git config user.name "quotes-bot"
          git config user.email "quotes-bot@users.noreply.github.com"
          git add -A   # stages whichever quotes file(s) this run produced
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "quotes $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash origin main || true
            git push
          fi
