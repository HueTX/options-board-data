name: Publish live quotes

on:
  schedule:
    - cron: '*/5 13-20 * * 1-5'
    - cron: '*/15 12-13 * * 1-5'
    - cron: '*/30 13-20 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requests
        run: python -m pip install --quiet --disable-pip-version-check requests

      - name: Fetch quotes
        run: |
          if [ "${{ github.event.schedule }}" = "*/30 13-20 * * 1-5" ]; then
            python fetch_quotes.py tickers_universe.txt quotes_universe.json --no-bars
          else
            python fetch_quotes.py tickers_priority.txt quotes.json
          fi

      - name: Commit and push
        run: |
          git config user.name "quotes-bot"
          git config user.email "quotes-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "quotes $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash origin main || true
            git push
          fi
