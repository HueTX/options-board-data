<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>15m Chart</title>
<style>
:root{
  --font: "SF Pro Display", -apple-system, BlinkMacSystemFont, ui-sans-serif, system-ui, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --radius: 18px;
}
html[data-theme="dark"]{
  --bg:#050506; --surface:#111114; --surface-2:#19191d;
  --orange:#ff9f0a; --gain:#30d158; --loss:#ff453a;
  --text:#f5f5f7; --text-dim:#98989f; --border:rgba(255,255,255,.08);
  --grid:rgba(255,255,255,.05);
}
html[data-theme="light"]{
  --bg:#f7f2e6; --surface:#fffdf6; --surface-2:#f6f0e1;
  --orange:#c46a00; --gain:#15803d; --loss:#dc2626;
  --text:#1c1c1e; --text-dim:#6b6b70; --border:rgba(0,0,0,.08);
  --grid:rgba(0,0,0,.05);
}
*{box-sizing:border-box; margin:0; padding:0}
body{background:var(--bg); color:var(--text); font-family:var(--font); padding:16px; max-width:900px; margin:0 auto; min-height:100vh}
a{color:var(--orange); text-decoration:none}
.header{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px}
.header h1{font-size:20px; font-weight:700; font-family:var(--mono)}
.back{font-size:14px}
.theme-btn{background:var(--surface-2); border:1px solid var(--border); color:var(--text); border-radius:10px; padding:6px 12px; font-size:13px; cursor:pointer}
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:12px}
#chart{width:100%; height:420px; display:block; touch-action:pan-x pan-y}
.legend{display:flex; flex-wrap:wrap; gap:10px; font-size:12px; font-family:var(--mono); color:var(--text-dim)}
.legend span{display:flex; align-items:center; gap:5px}
.sw{width:22px; height:0; border-top:2px dashed}
.sw.solid{border-top-style:solid}
.verdict{font-size:14px; font-weight:600; margin-top:8px}
.verdict.bull{color:var(--gain)} .verdict.bear{color:var(--loss)}
.note{font-size:12px; color:var(--text-dim); text-align:center; line-height:1.5; margin-top:8px}
.loading{text-align:center; color:var(--text-dim); padding:40px; font-size:14px}
.err{text-align:center; color:var(--loss); padding:40px; font-size:14px}

#toTop{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:44px;height:44px;border-radius:50%;border:1px solid #3a3a40;background:var(--card,#141416);color:#e8e6e1;font-size:20px;cursor:pointer;opacity:1;z-index:50;display:flex;align-items:center;justify-content:center}
#toTop:hover{border-color:#f59e0b;color:#f59e0b}
@media(max-width:640px){#toTop{right:14px;width:42px;height:42px}}
</style>
</head>
<body>
<div class="header">
  <a class="back" href="15m-closes.html">&larr; Closes</a>
  <h1 id="sym">—</h1>
  <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">Light</button>
</div>
<div class="card">
  <div id="loading" class="loading">Loading chart&hellip;</div>
  <canvas id="chart" style="display:none"></canvas>
  <div class="legend" id="legend" style="display:none; margin-top:10px"></div>
  <div class="verdict" id="verdict"></div>
</div>
<div class="note">15-minute close line from today's 9:30 ET open &middot; completed candles only<br>Dashed lines: prior-day high/low &middot; Dotted lines: premarket high/low &middot; Gray dashed: session mean</div>

<button id="toTop" type="button" aria-label="Go to bottom" title="Go to bottom">&#8595;</button>
<script>
(function(){
"use strict";
/* 15m-chart — rebuilt 2026-10-26. Same chart, verdict and level semantics as
   before; the payload is fetched once (with a timeout and a visible error
   state instead of a silent blank page) and redrawn from cache on resize. */
const FEED = 'https://raw.githubusercontent.com/HueTX/options-board-data/main/fifteen_min_charts.json';
const sym = (new URLSearchParams(location.search).get('t') || 'SPY').toUpperCase();
document.getElementById('sym').textContent = sym;
document.title = sym + ' — 15m Chart';
function setTheme(t){ document.documentElement.setAttribute('data-theme', t); document.getElementById('themeBtn').textContent = t === 'light' ? 'Dark' : 'Light'; try { localStorage.setItem('ofb_theme', t); } catch(e){} }
window.toggleTheme = function(){ setTheme(document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light'); };
setTheme(localStorage.getItem('ofb_theme') || 'dark');
const money = v => (v == null || !isFinite(v)) ? '—' : '$' + Number(v).toFixed(2);
let PAYLOAD = null;

function draw(){
  if (!PAYLOAD) return;
  const entry = (PAYLOAD.charts || {})[sym];
  const loading = document.getElementById('loading');
  const canvas = document.getElementById('chart');
  const legend = document.getElementById('legend');
  const verdict = document.getElementById('verdict');
  if (!entry){
    loading.style.display = 'block';
    loading.textContent = 'No 15-minute closes recorded for ' + sym + ' on ' + (PAYLOAD.marketDate || 'the latest session') + '.';
    canvas.style.display = 'none'; legend.style.display = 'none'; verdict.textContent = '';
    return;
  }
  const lv = entry.levels || {};
  const pre = (entry.premarket || []).map(c => ({t: c.t, c: c.c, pre: true}));
  const reg = (entry.candles15m || []).map(c => ({t: c.t, c: c.c, pre: false}));
  const pts = pre.concat(reg);
  if (!pts.length){ loading.textContent = 'No candles for ' + sym + '.'; return; }
  loading.style.display = 'none';
  canvas.style.display = 'block'; legend.style.display = 'flex';
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.clientWidth || 320, H = 340;
  canvas.width = W * dpr; canvas.height = H * dpr;
  const ctx = canvas.getContext('2d'); ctx.scale(dpr, dpr);
  const cs = getComputedStyle(document.documentElement);
  const bull = cs.getPropertyValue('--green').trim() || '#2fbf71';
  const bear = cs.getPropertyValue('--red').trim() || '#e5484d';
  let vals = pts.map(p => p.c);
  [lv.pdh, lv.pdl, lv.pmh, lv.pml].forEach(v => { if (v != null) vals.push(v); });
  let lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
  if (hi - lo < 1e-9){ hi += 0.5; lo -= 0.5; }
  const pad = (hi - lo) * 0.07; hi += pad; lo -= pad;
  const X = i => 8 + (W - 16) * (pts.length === 1 ? 0.5 : i / (pts.length - 1));
  const Y = v => 10 + (H - 20) * (1 - (v - lo) / (hi - lo));
  const lastClose = pts[pts.length - 1].c;
  function lvl(v, color, dash, label){
    if (v == null) return;
    ctx.save(); ctx.strokeStyle = color; ctx.globalAlpha = 0.85; ctx.lineWidth = 1.2; ctx.setLineDash(dash);
    ctx.beginPath(); ctx.moveTo(4, Y(v)); ctx.lineTo(W - 4, Y(v)); ctx.stroke();
    ctx.setLineDash([]); ctx.globalAlpha = 1; ctx.fillStyle = color; ctx.font = '600 10px system-ui';
    ctx.fillText(label + ' ' + money(v), 8, Y(v) - 4); ctx.restore();
  }
  lvl(lv.pdh, bull, [7, 5], 'PDH'); lvl(lv.pmh, bull, [2, 3], 'PMH');
  lvl(lv.pdl, bear, [7, 5], 'PDL'); lvl(lv.pml, bear, [2, 3], 'PML');
  const closes = reg.map(p => p.c);
  if (closes.length){
    const mean = closes.reduce((a, b) => a + b, 0) / closes.length;
    ctx.save(); ctx.strokeStyle = '#8b93a7'; ctx.globalAlpha = 0.8; ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(4, Y(mean)); ctx.lineTo(W - 4, Y(mean)); ctx.stroke(); ctx.restore();
  }
  const lineCol = lastClose >= (closes.length ? closes.reduce((a, b) => a + b, 0) / closes.length : lastClose) ? bull : bear;
  for (let i = 1; i < pts.length; i++){
    const a = pts[i - 1], b = pts[i];
    ctx.save();
    ctx.strokeStyle = b.pre ? '#8b93a7' : lineCol;
    ctx.globalAlpha = b.pre ? 0.6 : 1; ctx.lineWidth = b.pre ? 1.2 : 2.2;
    ctx.beginPath(); ctx.moveTo(X(i - 1), Y(a.c)); ctx.lineTo(X(i), Y(b.c)); ctx.stroke(); ctx.restore();
  }
  pts.forEach((p, i) => {
    if (p.pre) return;
    ctx.save(); ctx.fillStyle = lineCol;
    ctx.beginPath(); ctx.arc(X(i), Y(p.c), 2.4, 0, 7); ctx.fill(); ctx.restore();
  });
  legend.innerHTML =
    '<span><i style="background:' + bull + '"></i>PDH ' + money(lv.pdh) + '</span>' +
    '<span><i style="background:' + bull + '"></i>PMH ' + money(lv.pmh) + '</span>' +
    '<span><i style="background:' + bear + '"></i>PDL ' + money(lv.pdl) + '</span>' +
    '<span><i style="background:' + bear + '"></i>PML ' + money(lv.pml) + '</span>' +
    '<span>Last close ' + money(lastClose) + '</span>';
  const above = lv.pdh != null && lastClose > lv.pdh ? 'PDH' : (lv.pmh != null && lastClose > lv.pmh ? 'PMH' : null);
  if (above) verdict.innerHTML = '<span class="up">Bullish: last 15m close ' + money(lastClose) + ' above ' + above + ' ' + money(above === 'PDH' ? lv.pdh : lv.pmh) + '</span>';
  else if (lv.pdl != null && lv.pml != null && lastClose < lv.pdl && lastClose < lv.pml)
    verdict.innerHTML = '<span class="dn">Bearish: last 15m close ' + money(lastClose) + ' below PDL ' + money(lv.pdl) + ' and PML ' + money(lv.pml) + '</span>';
  else verdict.textContent = 'Neutral: last 15m close ' + money(lastClose) + ' is inside the level range.';
}

async function load(){
  const loading = document.getElementById('loading');
  const ctl = new AbortController();
  const to = setTimeout(() => ctl.abort(), 15000);
  try {
    const r = await fetch(FEED + '?t=' + Date.now(), {signal: ctl.signal, cache: 'no-store'});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    PAYLOAD = await r.json();
    draw();
  } catch(e){
    loading.style.display = 'block';
    loading.textContent = 'Chart feed unavailable (' + (e && e.message ? e.message : 'network error') + ') — reload to retry.';
  } finally { clearTimeout(to); }
}
let rzTo = null;
addEventListener('resize', () => { clearTimeout(rzTo); rzTo = setTimeout(draw, 150); });
load();
// back-to-top: the button element is above this script in the document,
// so it exists before this toggle wiring runs.
const toTop = document.getElementById('toTop');
addEventListener('scroll', () => { toTop.style.display = scrollY > 600 ? 'block' : 'none'; }, {passive: true});
toTop.onclick = () => scrollTo({top: 0, behavior: 'smooth'});
})();
</script>
</body>
</html>
